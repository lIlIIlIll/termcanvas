name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CANGJIE_SDK_VERSION: 1.1.3
      CANGJIE_CJPM_VERSION: 1.1.3
    steps:
      - uses: actions/checkout@v4
        with:
          path: termcanvas
          fetch-depth: 0

      - name: Setup Cangjie STS
        uses: Zxilly/setup-cangjie@f959b3d1078c92173ea67d398f293727639000f7
        with:
          channel: sts
          version: ${{ env.CANGJIE_SDK_VERSION }}
          archive-path: ${{ runner.temp }}/cangjie-sts.tar.gz

      - name: Configure canonical SDK
        shell: bash
        working-directory: termcanvas
        run: |
          set -euo pipefail
          sdk_root="$(dirname "$(dirname "$(command -v cjc)")")"
          echo "CANGJIE_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          printf 'CANGJIE_SDK_ROOT=%s\n' "$sdk_root"
          scripts/check_sdk.sh --report

      - name: Verify Cangjie SDK
        shell: bash
        working-directory: termcanvas
        run: |
          set -euo pipefail
          command -v cjc
          cjc -v
          command -v cjpm
          cjpm --version
          scripts/check_sdk.sh --report

      - name: Run release gate
        id: release_gate
        shell: bash
        working-directory: termcanvas
        run: scripts/ci_gate.sh

      - name: Generate Codecov coverage report
        shell: bash
        working-directory: termcanvas
        run: scripts/coverage.sh "$RUNNER_TEMP/termcanvas-codecov"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ runner.temp }}/termcanvas-codecov/coverage.xml
          flags: cangjie
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive SDK failure
        if: failure() && steps.release_gate.outcome == 'failure' && github.event_name != 'pull_request'
        shell: bash
        working-directory: termcanvas
        env:
          TERMCANVAS_PUSH_NIGHTLY_ARCHIVE: "1"
        run: scripts/archive_nightly_failure.sh "${CANGJIE_SDK_VERSION:-unknown-sdk}" "$GITHUB_SHA"
