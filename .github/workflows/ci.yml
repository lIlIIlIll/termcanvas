name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CANGJIE_SDK_CHANNEL: sts
      CANGJIE_SDK_VERSION: 1.1.3
    steps:
      - uses: actions/checkout@v7
        with:
          path: cj_tui
          fetch-depth: 0

      - name: Install pinned Cangjie STS SDK
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571 # v3.2.0
        with:
          channel: ${{ env.CANGJIE_SDK_CHANNEL }}
          version: ${{ env.CANGJIE_SDK_VERSION }}
          cjv-version: v0.2.21

      - name: Export Cangjie SDK root for repository checks
        shell: bash
        run: |
          set -euo pipefail
          : "${CANGJIE_HOME:?setup-cangjie did not export CANGJIE_HOME}"
          printf 'CANGJIE_SDK_ROOT=%s\n' "$CANGJIE_HOME" >> "$GITHUB_ENV"

      - name: Verify pinned Cangjie STS toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v cjc
          cjc -v
          command -v cjpm

      - name: Run release gate
        id: release_gate
        shell: bash
        working-directory: cj_tui
        run: scripts/ci_gate.sh

      - name: Generate Codecov coverage report
        shell: bash
        working-directory: cj_tui
        run: scripts/coverage.sh "$RUNNER_TEMP/cjtui-codecov"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ runner.temp }}/cjtui-codecov/coverage.xml
          flags: cangjie
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive nightly failure
        if: failure() && steps.release_gate.outcome == 'failure' && github.event_name != 'pull_request'
        shell: bash
        working-directory: cj_tui
        env:
          CJ_TUI_PUSH_NIGHTLY_ARCHIVE: "1"
        run: scripts/archive_nightly_failure.sh "${CJ_TUI_NIGHTLY_SDK_VERSION:-unknown-sdk}" "$GITHUB_SHA"
