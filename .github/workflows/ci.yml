name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CANGJIE_SDK_URL: ${{ secrets.CANGJIE_SDK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: cj_tui

      - name: Install Cangjie SDK from explicit URL
        if: env.CANGJIE_SDK_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cangjie-sdk"
          curl -fsSL "$CANGJIE_SDK_URL" -o "$RUNNER_TEMP/cangjie-sdk/sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/cangjie-sdk/sdk.tar.gz" -C "$RUNNER_TEMP/cangjie-sdk" --strip-components=1
          echo "$RUNNER_TEMP/cangjie-sdk/bin" >> "$GITHUB_PATH"
          echo "CANGJIE_HOME=$RUNNER_TEMP/cangjie-sdk" >> "$GITHUB_ENV"
          echo "CANGJIE_SDK_ROOT=$RUNNER_TEMP/cangjie-sdk" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/cangjie-sdk/lib:$RUNNER_TEMP/cangjie-sdk/runtime/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify Cangjie SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v cjc
          cjc -v
          command -v cjpm

      - name: Run release gate
        shell: bash
        working-directory: cj_tui
        run: scripts/ci_gate.sh
