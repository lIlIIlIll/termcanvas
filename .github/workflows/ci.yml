name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CANGJIE_SDK_URL: ${{ secrets.CANGJIE_SDK_URL }}
      TOKEN: ${{ secrets.DEVREPO_TOKEN }}
      CANGJIE_SDK_CHANNEL: main
      CANGJIE_SDK_VERSION: 1.1.0-alpha.20260817040003
    steps:
      - uses: actions/checkout@v4
        with:
          path: cj_tui
          fetch-depth: 0

      - name: Install canonical Cangjie SDK
        shell: bash
        working-directory: cj_tui
        run: |
          set -euo pipefail
          scripts/resolve_nightly_sdk.py --install --emit-github-env

      - name: Verify Cangjie SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v cjc
          cjc -v
          command -v cjpm

      - name: Run release gate
        id: release_gate
        shell: bash
        working-directory: cj_tui
        run: scripts/ci_gate.sh

      - name: Archive nightly failure
        if: failure() && steps.release_gate.outcome == 'failure' && github.event_name != 'pull_request'
        shell: bash
        working-directory: cj_tui
        env:
          CJ_TUI_PUSH_NIGHTLY_ARCHIVE: "1"
        run: scripts/archive_nightly_failure.sh "${CJ_TUI_NIGHTLY_SDK_VERSION:-unknown-sdk}" "$GITHUB_SHA"
