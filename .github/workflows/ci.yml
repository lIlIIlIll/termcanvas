name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CANGJIE_SDK_URL: ${{ secrets.CANGJIE_SDK_URL }}
      TOKEN: ${{ secrets.DEVREPO_TOKEN }}
      CANGJIE_SDK_CHANNEL: main
      CANGJIE_SDK_VERSION: 1.1.0-alpha.20260817040003
    steps:
      - uses: actions/checkout@v4
        with:
          path: termcanvas
          fetch-depth: 0

      - name: Install canonical Cangjie SDK
        shell: bash
        working-directory: termcanvas
        run: |
          set -euo pipefail
          scripts/resolve_nightly_sdk.py --install --emit-github-env

      - name: Verify Cangjie SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v cjc
          cjc -v
          command -v cjpm

      - name: Run release gate
        id: release_gate
        shell: bash
        working-directory: termcanvas
        run: scripts/ci_gate.sh

      - name: Generate Codecov coverage report
        shell: bash
        working-directory: termcanvas
        run: scripts/coverage.sh "$RUNNER_TEMP/termcanvas-codecov"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ runner.temp }}/termcanvas-codecov/coverage.xml
          flags: cangjie
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive nightly failure
        if: failure() && steps.release_gate.outcome == 'failure' && github.event_name != 'pull_request'
        shell: bash
        working-directory: termcanvas
        env:
          TERMCANVAS_PUSH_NIGHTLY_ARCHIVE: "1"
        run: scripts/archive_nightly_failure.sh "${TERMCANVAS_NIGHTLY_SDK_VERSION:-unknown-sdk}" "$GITHUB_SHA"
