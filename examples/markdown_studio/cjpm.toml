[package]
cjc-version = "1.1.0"
name = "markdown_studio"
organization = ""
description = "Markdown authoring studio built with cjtui"
version = "1.0.0"
target-dir = ""
script-dir = ""
output-type = "executable"
compile-option = "--static"
override-compile-option = ""
link-option = ""
package-configuration = {}

[dependencies]
"core" = { path = "../../packages/core", output-type = "static" }
"markdown_adapter" = { path = "../../packages/markdown_adapter", output-type = "static" }
"markdown" = { git = "https://github.com/lIlIIlIll/markdown.git", tag = "v0.9.0", output-type = "static" }
